name: multigeodta
channels:
  - pytorch
  - nvidia
  - conda-forge
  - dglteam/label/th21_cu118
dependencies:
  - python=3.8
  - pip
  - pytorch=2.1.0
  - pytorch-cuda=11.8
  - cudatoolkit=11.8
  - dgl
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pyyaml
  - joblib
  - tqdm
  - rdkit
  - biopython
  - pip:
    - -e ".[cuda118]"
    - pyg_lib torch_scatter torch_sparse torch_cluster torch_spline_conv -f https://data.pyg.org/whl/torch-2.1.0+cu118.html
    - dgl -f https://data.dgl.ai/wheels/torch-2.1/cu118/repo.html
    - huggingface_hub
